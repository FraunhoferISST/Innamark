<!DOCTYPE html>
<html lang="en">
<head>
    <title>Innamark JS Example</title>
    <script src="../../watermarker/build/dist/js/productionExecutable/watermarker.js"></script>
</head>

<body>
<h1>Innamark JS Example</h1>
<h2>Watermarked Text</h2>
<p id="watermarked-text"></p>
<h2>Extracted Watermark</h2>
<p id="extracted-watermark"></p>
<script>
    const pkg = watermarker.de.fraunhofer.isst.innamark.watermarker;
    const textWatermarker = new pkg.watermarkers.text.PlainTextWatermarker();
    const watermark = pkg.types.watermarks.Watermark.Companion.fromString("Hello World!");

    let text = "Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod \
tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et accusam \
et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est Lorem \
ipsum dolor sit amet. Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy \
eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et \
accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est \
Lorem ipsum.";

    const result = textWatermarker.addWatermark(text, watermark);

    if (result.isSuccess) {
        document.getElementById("watermarked-text").textContent = result.value;
        const extracted = textWatermarker.getWatermarkAsString(result.value);
        document.getElementById("extracted-watermark").textContent =
            extracted.hasValue ? extracted.value : extracted.toString();
    } else {
        document.getElementById("watermarked-text").textContent = result.toString();
    }
</script>
</body>
</html>
