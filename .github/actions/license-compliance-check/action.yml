name: REUSE and copyright checks
description: Check REUSE metadata, license text consistency, and changed-file copyright years

inputs:
  base-sha:
    description: Base commit of the pull request
    required: true

runs:
  using: composite
  steps:
    - name: Check license text consistency
      shell: bash
      run: |
        if ! cmp --silent LICENSE LICENSES/LicenseRef-Fraunhofer-License.txt; then
          echo "LICENSE and LICENSES/LicenseRef-Fraunhofer-License.txt must be identical."
          exit 1
        fi

    - name: Check REUSE compliance
      uses: fsfe/reuse-action@v6

    - name: Check copyright years
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/check-copyright-year.py" "$BASE_SHA"