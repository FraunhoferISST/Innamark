name: "SBOM: Watermarker"

on:
  push:
    branches: [ main ]
    paths: [ "watermarker/**", ".github/workflows/sbom_watermarker.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "watermarker/**", ".github/workflows/sbom_watermarker.yml" ]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }} @
    ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: License Gate & CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Run ORT (Analyzer -> Evaluator -> Reporter); upstream ort-config policy with
      # fail-on: violations fails the build on copyleft licenses
      - name: Run ORT
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@v1
        with:
          project-path: ${{ github.workspace }}/watermarker
          allow-dynamic-versions: 'true'
          fail-on: 'violations'
          report-formats: 'CycloneDx'
          run: >
            analyzer,
            evaluator,
            reporter

      # Publish the ORT-generated bom.cyclonedx.json for review
      - name: Upload CycloneDX SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watermarker-sbom-cyclonedx
          path: ${{ steps.ort.outputs.results-sbom-cyclonedx-json-path }}
          if-no-files-found: error
