version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
        - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      kotlin-gradle:
        patterns:
          - "org.jetbrains.kotlin*"
          - "gradle-wrapper"

  - package-ecosystem: "gradle"
    directory: "/cli"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "component: cli"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "documentation"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react"
          - "react-dom"

  - package-ecosystem: "gradle"
    directory: "/webinterface"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "component: webinterface"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      kvision:
        patterns:
          - "io.kvision:*"

  - package-ecosystem: "gradle"
    directory: "/watermarker"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "component: watermarker"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "pipeline"
    commit-message:
      prefix: "build"
      include: "scope"
